<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول | Shahd</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="login-card" id="loginCard">
  <div class="avatar">
    <img src="photo1.jpg" alt="Shahd">
  </div>
  
  <h2>أهلاً يا شهد</h2>
  <p>سجلي دخولك عشان تشوفي المفاجأة</p>

  <form id="loginForm">
    <input type="text" id="username" placeholder="الاسم (Shahd)" required>
    <input type="password" id="password" placeholder="الباسورد" required>
    <p class="error" id="errorMsg">الاسم أو الباسورد غلط ❌</p>
    <button type="submit">دخول</button>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
