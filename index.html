<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تسجيل الدخول | Shahd</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<!-- خلفية الكرات المضيئة -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- كارت تسجيل الدخول -->
<div class="login-container" id="loginCard">
  <div class="avatar-ring">
    <img src="photo1.jpg" alt="Shahd" class="avatar-img">
  </div>
  
  <h2 class="login-title">أهلاً بكِ يا شهد</h2>
  <p class="login-sub">سجلي دخولك لرؤية المفاجأة</p>

  <form id="loginForm">
    <div class="input-group">
      <input type="text" id="username" placeholder="الاسم (Shahd)" required autocomplete="off">
    </div>
    
    <div class="input-group">
      <input type="password" id="password" placeholder="الباسورد" required>
    </div>

    <p class="error-msg" id="errorMsg">الاسم أو الباسورد غلط ❌</p>

    <button type="submit" class="btn-login">
      <span>دخول</span>
    </button>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
